<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Орлы — Состав и Баллы</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --danger-color: #f85149;
            --success-color: #3fb950;
            --border-color: #30363d;
            --muted-color: #8b949e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .form-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        @media (max-width: 600px) {
            .input-grid {
                grid-template-columns: 1fr;
            }
        }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            padding: 10px 12px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-block {
            width: 100%;
            padding: 10px;
            background-color: #21262d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--accent-color);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-block:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .member-list {
            list-style: none;
            padding: 0;
            margin: 0 0 24px 0;
        }

        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 10px;
            background-color: rgba(255,255,255,0.02);
            gap: 15px;
        }

        @media (max-width: 600px) {
            .member-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .score-controls {
                width: 100%;
                justify-content: space-between;
            }
        }

        .member-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .member-fio {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }

        .member-role {
            font-size: 13px;
            color: var(--muted-color);
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            width: fit-content;
        }

        .score-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .score-btn {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.1s;
        }

        .score-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .score-display {
            font-weight: bold;
            min-width: 50px;
            text-align: center;
            color: var(--accent-color);
            font-size: 18px;
        }

        .btn-delete {
            color: var(--danger-color);
            border-color: var(--border-color);
            margin-left: 10px;
        }

        .btn-delete:hover {
            background-color: var(--danger-color);
            border-color: var(--danger-color);
            color: #fff !important;
        }

        .total-section {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .total-badge {
            background-color: rgba(56, 139, 253, 0.15);
            color: var(--accent-color);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(56, 139, 253, 0.4);
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🦅 Орлы: Учёт личного состава</h1>
    
    <!-- Форма добавления -->
    <div class="form-container">
        <div class="form-title">Добавление нового сотрудника</div>
        <div class="input-grid">
            <input type="text" id="lastNameInput" placeholder="Фамилия">
            <input type="text" id="firstNameInput" placeholder="Имя">
            <input type="text" id="roleInput" placeholder="Должность">
        </div>
        <button class="btn-block" onclick="addMember()">Добавить в состав</button>
    </div>

    <!-- Список сотрудников -->
    <ul class="member-list" id="memberList"></ul>

    <!-- Общий счётчик -->
    <div class="total-section">
        <span>Общая сумма баллов отдела:</span>
        <span class="total-badge" id="totalScore">0</span>
    </div>
</div>

<script>
    // Загрузка сохранённого списка сотрудников из памяти браузера
    let members = JSON.parse(localStorage.getItem('orly_system_data')) || [
        { id: 1, lastName: "Иванов", firstName: "Иван", role: "Старший оператор", score: 10 }
    ];

    function saveData() {
        localStorage.setItem('orly_system_data', JSON.stringify(members));
    }

    function render() {
        const list = document.getElementById('memberList');
        list.innerHTML = '';
        let total = 0;

        // Сортируем: у кого больше баллов, тот выше в списке
        members.sort((a, b) => b.score - a.score);

        members.forEach(member => {
            total += member.score;
            
            const li = document.createElement('li');
            li.className = 'member-item';
            li.innerHTML = `
                <div class="member-info">
                    <span class="member-fio">${member.lastName} ${member.firstName}</span>
                    <span class="member-role">${member.role || 'Должность не указана'}</span>
                </div>
                <div class="score-controls">
                    <button class="score-btn" onclick="changeScore(${member.id}, -1)">-1</button>
                    <span class="score-display">${member.score}</span>
                    <button class="score-btn" onclick="changeScore(${member.id}, 1)">+1</button>
                    <button class="score-btn" onclick="changeScore(${member.id}, 5)">+5</button>
                    <button class="score-btn" onclick="changeScore(${member.id}, 10)">+10</button>
                    <button class="score-btn btn-delete" onclick="deleteMember(${member.id})">❌</button>
                </div>
            `;
            list.appendChild(li);
        });

        document.getElementById('totalScore').innerText = total;
    }

    function addMember() {
        const lastName = document.getElementById('lastNameInput').value.trim();
        const firstName = document.getElementById('firstNameInput').value.trim();
        const role = document.getElementById('roleInput').value.trim();

        if (lastName === '' || firstName === '') {
            alert('Пожалуйста, заполните как минимум Фамилию и Имя сотрудника.');
            return;
        }

        const newMember = {
            id: Date.now(),
            lastName: lastName,
            firstName: firstName,
            role: role,
            score: 0
        };

        members.push(newMember);

        // Очищаем поля ввода
        document.getElementById('lastNameInput').value = '';
        document.getElementById('firstNameInput').value = '';
        document.getElementById('roleInput').value = '';

        saveData();
        render();
    }

    function deleteMember(id) {
        if(confirm("Вы уверены, что хотите удалить этого сотрудника из списка?")) {
            members = members.filter(m => m.id !== id);
            saveData();
            render();
        }
    }

    function changeScore(id, amount) {
        const member = members.find(m => m.id === id);
        if (member) {
