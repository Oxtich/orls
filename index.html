<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Орлы — Состав и Баллы</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --danger-color: #f85149;
            --success-color: #3fb950;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            padding: 8px 12px;
            font-size: 14px;
            flex: 1;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--accent-color);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .member-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
            background-color: rgba(255,255,255,0.02);
        }

        .member-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .member-name {
            font-weight: 500;
        }

        .score-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .score-btn {
            padding: 2px 8px;
            font-size: 12px;
        }

        .score-display {
            font-weight: bold;
            min-width: 40px;
            text-align: center;
            color: #fff;
        }

        .btn-delete {
            color: var(--danger-color);
            border-color: var(--border-color);
        }

        .btn-delete:hover {
            background-color: var(--danger-color);
            border-color: var(--danger-color);
            color: #fff;
        }

        .total-section {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .total-badge {
            background-color: rgba(56, 139, 253, 0.15);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(56, 139, 253, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🦅 Орлы: Состав команды</h1>
    
    <!-- Форма добавления участников -->
    <div class="input-group">
        <input type="text" id="nameInput" placeholder="Имя участника..." onkeypress="handleKeyPress(event)">
        <button onclick="addMember()">Добавить</button>
    </div>

    <!-- Список участников -->
    <ul class="member-list" id="memberList">
        <!-- Сюда будут добавляться люди -->
    </ul>

    <!-- Общий подсчет баллов -->
    <div class="total-section">
        <span>Всего баллов команды:</span>
        <span class="total-badge" id="totalScore">0</span>
    </div>
</div>

<script>
    // Изначальный список участников
    let members = [
        { id: 1, name: "Алексей", score: 10 },
        { id: 2, name: "Иван", score: 15 }
    ];

    function render() {
        const list = document.getElementById('memberList');
        list.innerHTML = '';
        let total = 0;

        members.forEach(member => {
            total += member.score;
            
            const li = document.createElement('li');
            li.className = 'member-item';
            li.innerHTML = `
                <div class="member-info">
                    <span class="member-name">${member.name}</span>
                </div>
                <div class="score-controls">
                    <button class="score-btn" onclick="changeScore(${member.id}, -1)">-1</button>
                    <span class="score-display">${member.score}</span>
                    <button class="score-btn" onclick="changeScore(${member.id}, 1)">+1</button>
                    <button class="btn-delete score-btn" onclick="deleteMember(${member.id})">❌</button>
                </div>
            `;
            list.appendChild(li);
        });

        document.getElementById('totalScore').innerText = total;
    }

    function addMember() {
        const input = document.getElementById('nameInput');
        const name = input.value.trim();
        if (name === '') return;

        const newMember = {
            id: Date.now(),
            name: name,
            score: 0
        };

        members.push(newMember);
        input.value = '';
        render();
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            addMember();
        }
    }

    function deleteMember(id) {
        members = members.filter(m => m.id !== id);
        render();
    }

    function changeScore(id, amount) {
        const member = members.find(m => m.id === id);
        if (member) {
            member.score += amount;
            // Баллы не могут быть меньше 0
            if (member.score < 0) member.score = 0; 
            render();
        }
    }

    // Первоначальный запуск
    render();
</script>

</body>
</html>
